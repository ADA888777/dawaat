# بناء تطبيق دعوات (Capacitor) تلقائياً:
#   • أندرويد: APK تصحيحي موقّع بمفتاح debug — يُثبَّت مباشرة على أي جهاز أندرويد.
#   • iOS: ‏App غير موقّع يُحزم كـ IPA — يوقَّع على جهازك بـ Sideloadly/Xcode بحساب Apple ID
#     مجاني (التثبيت المباشر على آيفونك لا يحتاج حساب المطور المدفوع؛ المدفوع للنشر فقط).
# الناتجان يُحمَّلان من تبويب Actions ← تشغيلة «Mobile apps» ← Artifacts.
name: Mobile apps

on:
  workflow_dispatch:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

jobs:
  android-apk:
    name: أندرويد — APK تصحيحي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: تثبيت حزم Capacitor
        working-directory: mobile
        run: npm ci
      - name: مزامنة مشروع أندرويد
        working-directory: mobile
        run: npx cap sync android
      - name: بناء APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dawaat-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-unsigned-ipa:
    name: iOS — IPA غير موقّع
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: تثبيت حزم Capacitor
        working-directory: mobile
        run: npm ci
      - name: مزامنة مشروع iOS
        working-directory: mobile
        run: npx cap sync ios
      - name: بناء التطبيق بلا توقيع
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: تحزيم IPA
        working-directory: mobile/ios/App
        run: |
          APP_PATH=$(find build/Build/Products -name "App.app" -type d | head -1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry dawaat-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: dawaat-ios-unsigned-ipa
          path: mobile/ios/App/dawaat-unsigned.ipa
          if-no-files-found: error
