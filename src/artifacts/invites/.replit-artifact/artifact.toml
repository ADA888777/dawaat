kind = "web"
previewPath = "/"
title = "دعوات"
version = "1.0.0"
id = "artifacts/invites"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19176

[services.development]
run = "pnpm --filter @workspace/invites run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/invites", "run", "build" ]
serve = "static"
publicDir = "artifacts/invites/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19176"
BASE_PATH = "/"
