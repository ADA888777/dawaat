<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <meta name="theme-color" content="#F7F1EA" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:site_name" content="دعوات" />
    <meta property="og:locale" content="ar_SA" />

        <!-- [أمان] كان هنا onload مضمّن، وهو سكربت داخل الصفحة يمنع
         تطبيق Content-Security-Policy صارمة. رابط تنسيق عادي يؤدي
         نفس الغرض بلا أي جافاسكربت مضمّن. خط Cairo مستورد أيضاً في
         index.css فالمتصفح يستفيد من نفس الطلب. -->

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
